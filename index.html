<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console professeur – Mini-entreprises 3P Vente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,700&family=Fredoka:wght@600&family=Bebas+Neue&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a0618; --bg-1:#140b2c; --bg-2:#1c1238;
  --pink:#ff3d8b; --magenta:#e935c5; --violet:#9d4edd; --indigo:#6366f1; --cyan:#22d3ee; --sky:#38bdf8;
  --lime:#a3e635; --emerald:#34d399; --orange:#fb923c; --yellow:#fbbf24;
  --text:rgba(255,255,255,.93); --soft:rgba(255,255,255,.72); --dim:rgba(255,255,255,.5);
  --border:rgba(255,255,255,.12); --border-soft:rgba(255,255,255,.07);
  --glass:rgba(255,255,255,.05); --glass-2:rgba(255,255,255,.08);
  --grad:linear-gradient(120deg,var(--pink),var(--magenta) 35%,var(--violet) 70%,var(--indigo));
  --ui:'Outfit','Segoe UI',Arial,sans-serif; --serif:'Fraunces',Georgia,serif; --mono:'Space Mono',Consolas,monospace;
  --paper-ink:#1D1F33; --paper-line:#E3E5EF; --r:18px; --r-lg:26px;
}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:var(--ui); background:var(--bg-deep); color:var(--text); font-size:17px; line-height:1.5; min-height:100vh; overflow-x:hidden}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--cyan); outline-offset:3px}
[hidden]{display:none !important}
.mesh{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.blob{position:absolute; border-radius:50%; filter:blur(110px); opacity:.32; mix-blend-mode:screen}
.b1{width:620px;height:620px;background:var(--pink);top:-160px;left:10%;animation:d1 26s ease-in-out infinite}
.b2{width:560px;height:560px;background:var(--violet);top:20%;right:-160px;animation:d2 30s ease-in-out infinite}
.b3{width:600px;height:600px;background:var(--cyan);bottom:-220px;left:30%;opacity:.2;animation:d3 34s ease-in-out infinite}
@keyframes d1{50%{transform:translate(90px,120px) scale(1.1)}} @keyframes d2{50%{transform:translate(-120px,100px)}} @keyframes d3{50%{transform:translate(120px,-90px) scale(1.15)}}
body::after{content:''; position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E")}
.glass{background:var(--glass); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); border:1px solid var(--border); border-radius:var(--r-lg)}
.grad{background:linear-gradient(120deg,var(--pink),var(--magenta) 30%,var(--violet) 60%,var(--cyan)); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; font-style:italic; font-weight:500; animation:gs 8s ease-in-out infinite}
@keyframes gs{50%{background-position:100% 50%}}

/* ═══ Structure ═══ */
.app{position:relative; z-index:2; display:grid; grid-template-columns:268px minmax(0,1fr); min-height:100vh}
.rail{position:sticky; top:0; height:100vh; padding:22px 16px; display:flex; flex-direction:column; gap:6px; background:rgba(10,6,24,.6); backdrop-filter:blur(20px); border-right:1px solid var(--border-soft)}
.brand{display:flex; align-items:center; gap:12px; padding:4px 8px 18px}
.brand .lg{width:44px; height:44px; border-radius:14px; background:var(--grad); display:grid; place-items:center; font-family:var(--serif); font-weight:700; color:#fff; box-shadow:0 0 24px rgba(233,53,197,.5)}
.brand b{display:block; font-family:var(--serif); font-size:18px; line-height:1.1; color:#fff}
.brand small{color:var(--dim); font-size:13px}
.navlab{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); padding:14px 12px 6px}
.nv{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 12px; border-radius:14px; border:1px solid transparent; background:none; color:var(--soft); cursor:pointer; font-size:16px; transition:background .2s}
.nv .i{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--glass-2); font-size:18px; flex:none}
.nv:hover{background:var(--glass)}
.nv.on{background:linear-gradient(120deg,rgba(255,61,139,.2),rgba(157,78,221,.2)); border-color:rgba(233,53,197,.35); color:#fff}
.nv.on .i{background:var(--grad)}
.rail .foot{margin-top:auto; font-size:13px; color:var(--dim); padding:8px}
main{min-width:0; padding:26px 34px 60px}
.topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:26px}
.src{display:flex; align-items:center; gap:10px; padding:8px 16px; border-radius:999px; font-size:14px}
.dot{width:9px; height:9px; border-radius:50%; background:var(--emerald); box-shadow:0 0 10px var(--emerald)}
.dot.demo{background:var(--yellow); box-shadow:0 0 10px var(--yellow)}
.dot.off{background:var(--pink); box-shadow:0 0 10px var(--pink)}
.tb-r{margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.btn{border:0; border-radius:14px; padding:11px 20px; font-weight:600; font-size:15px; cursor:pointer; color:#fff; transition:transform .2s, box-shadow .2s}
.btn-main{background:var(--grad); box-shadow:0 10px 26px rgba(233,53,197,.35)}
.btn-main:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none; box-shadow:none}
.btn-ghost{background:var(--glass); border:1px solid var(--border)}
.btn-ghost:hover{background:var(--glass-2)}
.btn-ghost.on{border-color:var(--cyan); color:var(--cyan)}
.spin{display:inline-block; width:16px; height:16px; border:3px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ═══ Titres de section ═══ */
.sec-head{margin-bottom:22px}
.kick{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); padding:6px 14px; border-radius:999px; background:var(--glass); border:1px solid var(--border); margin-bottom:12px}
.kick .led{width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 10px var(--lime)}
h2.h{font-family:var(--serif); font-weight:600; font-size:clamp(32px,3.4vw,50px); line-height:1.05; letter-spacing:-.015em; color:#fff}
.lead{color:var(--soft); font-size:18px; margin-top:8px; max-width:70ch}

/* ═══ Vue d'ensemble ═══ */
.kpis{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; margin-bottom:18px}
.kpi{padding:18px 20px; position:relative; overflow:hidden}
.kpi::after{content:''; position:absolute; right:-30px; top:-30px; width:110px; height:110px; border-radius:50%; background:var(--c,var(--pink)); opacity:.18; filter:blur(10px)}
.kpi .n{font-family:var(--mono); font-weight:700; font-size:38px; line-height:1; color:#fff}
.kpi .l{color:var(--soft); font-size:14px; margin-top:6px}
.kpi .ic{font-size:22px; margin-bottom:8px}
.grid2{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:18px}
.panel{padding:22px 24px}
.panel h3{font-family:var(--serif); font-weight:600; font-size:22px; color:#fff; margin-bottom:14px}
.bar{display:grid; grid-template-columns:34px minmax(0,1fr) 150px 44px; align-items:center; gap:12px; padding:7px 0}
.bar .e{font-size:22px; text-align:center}
.bar .t{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar .track{height:12px; border-radius:8px; background:rgba(255,255,255,.08); overflow:hidden}
.bar .fill{height:100%; border-radius:8px; background:var(--grad); transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar .v{font-family:var(--mono); font-weight:700; text-align:right}
.donut-wrap{display:flex; align-items:center; gap:20px; flex-wrap:wrap}
.legend{display:grid; gap:8px}
.legend div{display:flex; align-items:center; gap:10px; font-size:15px}
.legend i{width:14px; height:14px; border-radius:4px; flex:none}
table.list{width:100%; border-collapse:collapse}
table.list th{text-align:left; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); padding:10px 12px; border-bottom:1px solid var(--border)}
table.list td{padding:10px 12px; border-bottom:1px solid var(--border-soft); vertical-align:middle}
table.list tr:hover td{background:rgba(255,255,255,.03)}
.who{display:flex; align-items:center; gap:12px}
.who small{display:block; color:var(--dim); font-size:13px}
.prog{height:8px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; min-width:120px}
.prog i{display:block; height:100%; background:var(--grad)}
.st{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:4px 12px; border-radius:999px}
.st.termine{background:rgba(52,211,153,.15); color:#8ff0c6; border:1px solid rgba(52,211,153,.4)}
.st.en_cours{background:rgba(56,189,248,.14); color:#9fdcff; border:1px solid rgba(56,189,248,.4)}
.st.reinitialise{background:rgba(251,191,36,.14); color:#ffd97a; border:1px solid rgba(251,191,36,.4)}
.link{background:none; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:6px 12px; cursor:pointer; font-size:14px}
.link:hover{border-color:var(--magenta); color:#ff9bd9}

/* ═══ Logo, tuiles d'entreprise ═══ */
.lg-mark{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:22px; flex:none}
.f-moderne{font-family:var(--ui); font-weight:800}
.f-elegant{font-family:'Playfair Display',Georgia,serif; font-style:italic; font-weight:700}
.f-fun{font-family:'Fredoka','Comic Sans MS',sans-serif; font-weight:600}
.f-street{font-family:'Bebas Neue',Impact,sans-serif; font-weight:400; letter-spacing:1.2px}
.tiles{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.06); border:1px solid var(--border); border-left:5px solid var(--b,#8E4EC6); cursor:pointer; text-align:left; color:var(--text); width:100%; transition:transform .25s, background .2s}
.tile:hover{transform:translateY(-3px); background:rgba(255,255,255,.1)}
.tile .nm{font-size:19px; line-height:1.1; color:#fff}
.tile small{display:block; color:var(--soft); font-size:13px; margin-top:2px}
.tile .enc{font-size:11px; color:#9fdcff}
.cols{display:grid; gap:16px}
.col{padding:18px; display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden}
.col::before{content:''; position:absolute; inset:0 0 auto 0; height:5px; background:linear-gradient(90deg,var(--c1),var(--c2))}
.col h3{font-family:var(--serif); font-weight:600; font-size:22px; color:#fff; line-height:1.15}
.col .slog{font-style:italic; color:var(--c1); font-weight:600}
.col .def{color:var(--soft); font-size:15px}
.col .count{display:flex; align-items:baseline; gap:8px}
.col .count b{font-family:var(--mono); font-size:44px; line-height:1; background:linear-gradient(90deg,var(--c1),var(--c2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.col .count span{color:var(--soft); font-size:14px}
.refs{display:flex; flex-wrap:wrap; gap:6px}
.ref{font-size:12.5px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.07); color:var(--soft); border:1px dashed rgba(255,255,255,.2)}
.empty{padding:16px; border:1px dashed var(--border); border-radius:14px; color:var(--dim); font-size:14px; text-align:center}
.ask{display:flex; gap:14px; align-items:flex-start; padding:16px 20px; margin-top:20px; border-radius:var(--r); border:1px solid rgba(251,191,36,.45); background:rgba(251,191,36,.07)}
.ask .q{font-size:26px}
.ask b{color:var(--yellow)}
.defs{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px}
.defs > div{padding:16px 20px}
.defs b{font-family:var(--serif); font-size:20px; color:#fff}
.defs p{color:var(--soft); font-size:15px; margin-top:4px}
.chain{display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:10px; align-items:stretch; margin-bottom:18px}
.chain > div{padding:14px 16px; border-radius:16px; text-align:center}
.chain .arr{display:grid; place-items:center; font-size:30px; color:var(--yellow); background:none; padding:0}
.chain b{display:block; font-family:var(--serif); font-size:18px; color:#fff}
.chain small{color:var(--soft)}

/* ═══ Cartes d'identité (grille) ═══ */
.idg{display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px}
.idc{background:linear-gradient(135deg,#FAFBFF,#ECEAFB); color:var(--paper-ink); border-radius:18px; padding:18px 20px 16px 26px; position:relative; overflow:hidden; box-shadow:0 18px 44px rgba(0,0,0,.45); cursor:pointer; transition:transform .25s}
.idc:hover{transform:translateY(-4px) rotate(-.3deg)}
.idc::before{content:''; position:absolute; inset:0 auto 0 0; width:9px; background:var(--b,#8E4EC6)}
.idc .hd{padding-right:86px; display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--paper-line); padding-bottom:10px; margin-bottom:10px}
.idc .hd .t{font-size:21px; line-height:1.1}
.idc .hd small{display:block; color:#5B5F7A; font-size:13px; font-family:var(--ui); font-style:normal; font-weight:500; letter-spacing:0}
.idc dl{display:grid; grid-template-columns:128px 1fr; gap:4px 10px; font-size:14px}
.idc dt{color:#6B6F88}
.idc dd{font-weight:500}
.idc .num{font-family:var(--mono); font-weight:700; font-size:13.5px; background:#FFF3C4; border-radius:5px; padding:0 6px}
.idc .num.hide{background:#1D1F33; color:transparent; user-select:none}
.idc .ok{position:absolute; right:14px; top:14px; transform:rotate(-8deg); border:2px solid #2E9E5B; color:#2E9E5B; font-weight:800; font-size:11px; padding:1px 8px; border-radius:6px; opacity:.85}
.idc .wip{position:absolute; right:14px; top:16px; font-size:11px; font-weight:700; color:#2B7BB9}

/* ═══ Élève par élève ═══ */
.pres-top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.pres-top select{background:rgba(10,6,24,.6); color:#fff; border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:15px}
.pres-top option{background:var(--bg-1)}
.arrow{width:48px; height:48px; border-radius:50%; border:1px solid var(--border); background:var(--glass); color:#fff; font-size:20px; cursor:pointer}
.arrow:hover{background:var(--grad); border-color:transparent}
.pos{font-family:var(--mono); color:var(--soft)}
.pres{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:20px; align-items:start}
.stage{padding:18px; border-radius:var(--r-lg); position:relative; overflow:hidden}
.stage .front{width:100%; display:block; border-radius:18px; background:linear-gradient(180deg,#1b1340,#2a1a4d)}
.who-big{display:flex; align-items:center; gap:16px; margin-bottom:6px}
.who-big .lg-mark{width:74px; height:74px; font-size:36px}
.who-big .dn{font-size:clamp(28px,2.6vw,40px); line-height:1.05; color:#fff}
.who-big .sl{color:var(--soft); font-size:16px; margin-top:4px}
.student{font-family:var(--serif); font-size:20px; color:#fff; margin:14px 0 10px}
.student span{color:var(--dim); font-family:var(--ui); font-size:14px; margin-left:8px}
.tags{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 16px}
.tag{font-size:13.5px; font-weight:600; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.07); border:1px solid var(--border)}
.cards3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:20px}
.card{padding:18px 20px}
.card h4{font-family:var(--serif); font-weight:600; font-size:19px; color:#fff; margin-bottom:10px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:13px; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--border)}
.stat-row{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:14px}
.mini{padding:12px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid var(--border-soft); text-align:center}
.mini b{display:block; font-family:var(--mono); font-size:22px; color:#fff}
.mini span{font-size:12.5px; color:var(--dim)}
.thumbs{display:flex; gap:10px; overflow-x:auto; padding:14px 4px 6px; margin-top:22px}
.thumb{flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:0; color:var(--soft); cursor:pointer; font-size:12px; width:74px; opacity:.6; transition:opacity .2s, transform .2s}
.thumb:hover,.thumb.on{opacity:1; transform:translateY(-3px)}
.thumb.on .lg-mark{box-shadow:0 0 0 3px #fff, 0 0 22px rgba(255,255,255,.4) !important}
.idcard{background:linear-gradient(135deg,#F8F9FF,#ECEAFB); color:var(--paper-ink); border-radius:18px; padding:20px 22px 18px 30px; position:relative; overflow:hidden; box-shadow:0 18px 44px rgba(0,0,0,.45)}
.idcard::before{content:""; position:absolute; inset:0 auto 0 0; width:10px; background:var(--b,#8E4EC6)}
.idcard h5{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#6B6F88; margin-bottom:8px}
.idcard dl{display:grid; grid-template-columns:150px 1fr; gap:6px 12px; font-size:15px}
.idcard dt{color:#6B6F88}
.idcard .num{font-family:var(--mono); font-weight:700; background:#FFF3C4; border-radius:5px; padding:0 6px}
.patri{background:#fff; color:var(--paper-ink); border-radius:14px; overflow:hidden}
.patri .ph{background:var(--b,#8E4EC6); color:var(--ob,#fff); padding:8px 14px; font-weight:700; font-size:14px}
.patri .pc{display:grid; grid-template-columns:1fr 1fr}
.patri .pc > div{padding:10px 12px; font-size:13px}
.patri .pc > div + div{border-left:2px solid var(--paper-line)}
.patri h6{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#6B6F88; margin-bottom:4px}
.patri .pl{display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-bottom:1px dashed var(--paper-line)}
.patri .pl span:last-child{font-family:var(--mono); font-weight:700; white-space:nowrap}
.patri .neg span:last-child{color:#C0392B}
.patri .pt{display:flex; justify-content:space-between; padding:8px 12px; background:#F4F2FB; font-weight:700; font-size:14px}
.biz{width:100%; max-width:440px; aspect-ratio:85/55; background:#fff; color:#1D1F33; border-radius:12px; display:grid; grid-template-columns:34% 66%; overflow:hidden; box-shadow:0 14px 34px rgba(0,0,0,.4)}
.biz .l{background:var(--b,#8E4EC6); display:grid; place-items:center}
.biz .l .lg-mark{width:56px; height:56px; font-size:27px}
.biz .r{padding:12px 14px; display:flex; flex-direction:column; justify-content:center; font-size:11.5px; color:#4A4E68; gap:1px}
.biz .bn{font-size:18px; color:#1D1F33; line-height:1.1}
.biz .bs{font-size:10.5px; margin-bottom:6px}
.biz .who2{font-weight:700; color:#1D1F33; font-size:12.5px}

/* ═══ Connexion ═══ */
.gate{max-width:620px; margin:8vh auto 0; padding:34px 36px; text-align:left}
.gate h2{font-family:var(--serif); font-size:40px; line-height:1.05; color:#fff; margin-bottom:10px}
.gate label{display:block; font-weight:600; margin:18px 0 6px}
.inp{width:100%; background:rgba(10,6,24,.6); color:#fff; border:1px solid var(--border); border-radius:14px; padding:13px 16px; font-size:16px}
.inp:focus{outline:none; border-color:var(--magenta); box-shadow:0 0 0 4px rgba(233,53,197,.2)}
.help{font-size:14px; color:var(--dim); margin-top:6px}
.err{color:#ffb4c8; margin-top:10px}

/* ═══ Donut, confettis ═══ */
.donut text{font-family:var(--mono); font-weight:700}
.fade-in{animation:fi .5s ease-out both}
@keyframes fi{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}

/* ═══ Projection ═══ */
body.projo{font-size:19px}
body.projo .rail{display:none}
body.projo .app{grid-template-columns:minmax(0,1fr)}
body.projo main{padding:22px 40px}

/* ═══ Module « Les étapes d'un achat » ═══ */
.stepbar{display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:8px; margin-bottom:18px}
.sb{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border-radius:16px; background:var(--glass); border:1px solid var(--border); color:var(--soft); cursor:pointer; font-size:12.5px; text-align:center; line-height:1.2}
.sb .n{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:17px; background:rgba(255,255,255,.08)}
.sb.on{background:linear-gradient(120deg,rgba(255,61,139,.22),rgba(157,78,221,.22)); border-color:rgba(233,53,197,.45); color:#fff}
.sb.on .n{background:var(--grad)}
.sb.vu .n{background:rgba(52,211,153,.25)}
.sb.lock{opacity:.6}
.slide{display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); gap:22px; align-items:start}
.sx{padding:24px 26px}
.sx .num{font-family:var(--mono); color:var(--yellow); font-size:14px}
.sx h3{font-family:var(--serif); font-weight:600; font-size:clamp(26px,2.4vw,36px); line-height:1.1; color:#fff; margin:6px 0 14px}
.sx .who{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
.sx .who span{font-size:14px; font-weight:600; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--border)}
.sx p{color:var(--soft); font-size:17px; margin-bottom:10px}
.sx .retenir{margin-top:14px; padding:14px 16px; border-radius:14px; border:1px solid rgba(52,211,153,.45); background:rgba(52,211,153,.08); color:#d9fbe9; font-size:16px}
.sx .retenir b{color:#9ff0c9}
.sdoc{min-width:0}
.slide.large{grid-template-columns:1fr}
.slide.large .sx{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px 28px; align-items:start}
.slide.large .sx .num,.slide.large .sx h3,.slide.large .sx .who{grid-column:1/-1}
.ex-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px}
.ex-bar select{background:rgba(10,6,24,.6); color:#fff; border:1px solid var(--border); border-radius:12px; padding:9px 12px; font-size:14px}
.ex-bar option{background:var(--bg-1)}
.paper{background:#fff; color:#1D1F33; border-radius:8px; padding:26px 30px; box-shadow:0 22px 60px rgba(0,0,0,.5); font-size:15px; line-height:1.45}
.paper p{margin-bottom:8px}
.paper .dh{display:flex; justify-content:space-between; gap:18px; align-items:flex-start}
.paper .from{display:flex; gap:12px; align-items:flex-start}
.paper .from .emb{width:48px; height:48px; border-radius:12px; display:grid; place-items:center; font-size:24px; flex:none}
.paper .from .co{font-size:20px; line-height:1.15}
.paper .from p{margin:3px 0 0; font-size:13px; color:#4A4E68}
.paper .from .ids{font-family:var(--mono); font-size:11.5px}
.paper .to{border:1px solid #D5D8E6; border-radius:8px; padding:10px 14px; min-width:200px; font-size:14px}
.paper .to .lbl{font-size:11px; color:#6B6F88}
.paper .place{text-align:right; margin:18px 0 6px; font-size:14px}
.paper h3.doc{font-size:21px; letter-spacing:.5px; margin:2px 0}
.paper .ref{font-family:var(--mono); font-size:12.5px; color:#4A4E68; margin-bottom:12px}
.paper table{width:100%; border-collapse:collapse; margin:10px 0}
.paper th{background:#F0F2FA; text-align:left; font-size:12.5px; padding:7px 8px; border-bottom:2px solid #1D1F33}
.paper td{padding:7px 8px; border-bottom:1px solid #E3E5EF; font-size:14px}
.paper .sig{margin-top:14px; display:flex; justify-content:flex-end}
.paper .sig div{text-align:center; min-width:220px}
.paper .signed{font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:22px; color:#2A2F7A}
.paper .sig small{display:block; color:#6B6F88; font-size:12px}
.paper .foot{margin-top:16px; border-top:1px solid #E3E5EF; padding-top:6px; font-size:11px; color:#8A8FA8; text-align:center}
.offres3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.offre{background:#fff; color:#1D1F33; border-radius:12px; padding:14px; box-shadow:0 14px 34px rgba(0,0,0,.4); display:flex; flex-direction:column; gap:6px; position:relative; border:3px solid transparent; font-size:13px}
.offre.on{border-color:#E935C5; box-shadow:0 0 0 4px rgba(233,53,197,.35), 0 14px 34px rgba(0,0,0,.4)}
.offre.on::after{content:"✓ Offre choisie"; position:absolute; top:-12px; right:10px; background:var(--grad); color:#fff; font-weight:700; font-size:12px; padding:3px 10px; border-radius:999px}
.offre .oh{border-bottom:2px solid #E3E5EF; padding-bottom:6px}
.offre .oh b{font-size:15px}
.offre .oh small{display:block; color:#6B6F88; font-size:11px; line-height:1.3}
.offre .atout{align-self:flex-start; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; background:#F1E9FF; color:#6B2FB3}
.offre .art{font-weight:700; font-size:14px}
.offre .ln{display:flex; justify-content:space-between; gap:6px}
.offre .ln span:last-child{font-family:var(--mono); font-weight:700; white-space:nowrap}
.offre .tot{display:flex; justify-content:space-between; background:#F4F2FB; border-radius:8px; padding:6px 8px; font-weight:800}
.offre .tot span:last-child{font-family:var(--mono); white-space:nowrap}
.offre .cond{font-size:12px; color:#4A4E68; display:grid; gap:1px}
.mail{background:#fff; color:#1D1F33; border-radius:12px; overflow:hidden; box-shadow:0 22px 60px rgba(0,0,0,.5); font-size:15px}
.mail .mh{background:#F0F2FA; padding:12px 18px; font-size:13.5px; display:grid; gap:3px; border-bottom:1px solid #E3E5EF}
.mail .mh b{display:inline-block; width:58px; color:#6B6F88; font-weight:600}
.mail .mb{padding:16px 20px; line-height:1.55}
.mail .mb p{margin-bottom:8px}
.methods{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.method{padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid var(--border); font-size:14px}
.method.on{border-color:rgba(233,53,197,.6); background:rgba(233,53,197,.12)}
.method b{display:block; color:#fff; font-size:15px; margin-bottom:3px}
.method .p{color:#9ff0c9} .method .c{color:#ffc4d4}
.needs{display:grid; gap:12px}
.needc{display:flex; gap:14px; align-items:center; padding:16px 18px; border-radius:16px; background:rgba(255,255,255,.06); border:1px solid var(--border)}
.needc .i{font-size:40px}
.needc b{display:block; font-family:var(--serif); font-size:20px; color:#fff}
.needc p{color:var(--soft); font-size:14px; margin:0}
.budget{margin-top:12px; padding:14px 18px; border-radius:14px; background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.45); font-size:16px}
.budget b{font-family:var(--mono); color:#9ff0c9}
.cmp{width:100%; border-collapse:collapse; margin-top:14px; font-size:14px}
.cmp th,.cmp td{padding:7px 9px; border-bottom:1px solid var(--border-soft); text-align:left}
.cmp th{color:var(--dim); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase}
.cmp td.best{color:#6ee7b7; font-weight:700}
.checks{display:grid; gap:8px; margin-top:14px}
.checks div{padding:10px 14px; border-radius:12px; background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.4); font-size:15px}
.receipt{max-width:300px; margin:0 auto; background:#fff; color:#1D1F33; font-family:var(--mono); font-size:13px; padding:16px 18px; box-shadow:0 18px 40px rgba(0,0,0,.45); border-radius:6px}
.receipt .c{text-align:center}
.receipt hr{border:0; border-top:1px dashed #999; margin:8px 0}
.receipt .r{display:flex; justify-content:space-between; gap:10px}
.notif2{max-width:340px; margin:14px auto 0; background:rgba(255,255,255,.95); color:#1D1F33; border-radius:16px; padding:12px 14px; font-size:14px}
.notif2 .nh{display:flex; justify-content:space-between; font-size:12px; color:#6B6F88}
.lockdoc{position:relative; border-radius:10px; overflow:hidden}
.lockdoc .paper{filter:blur(3px); opacity:.65}
.lockdoc .lk{position:absolute; inset:0; display:grid; place-items:center; text-align:center; background:rgba(10,6,24,.35)}
.lockdoc .lk div{background:rgba(10,6,24,.85); border:1px solid rgba(251,191,36,.6); border-radius:18px; padding:18px 24px; color:#fff; font-size:17px}
.lockdoc .lk b{display:block; font-family:var(--serif); font-size:24px; color:var(--yellow)}
.circuit{display:grid; grid-template-columns:200px minmax(0,1fr) 200px; gap:14px; align-items:stretch}
.circuit .side{display:grid; place-items:center; text-align:center; padding:18px; border-radius:22px}
.circuit .side .i{font-size:56px}
.circuit .side b{display:block; font-family:var(--serif); font-size:22px; color:#fff}
.circuit .flows{display:grid; gap:10px}
.flow{display:grid; grid-template-columns:34px minmax(0,1fr) 34px; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid var(--border); font-size:15px}
.flow .ar{font-size:24px; color:var(--yellow); text-align:center}
.flow .t b{color:#fff} .flow .t small{display:block; color:var(--dim); font-size:12.5px}
.flow.soon{opacity:.55; border-style:dashed}
.snav{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:20px}
@media (max-width:1200px){ .slide{grid-template-columns:1fr} .stepbar{grid-template-columns:repeat(4,minmax(0,1fr))} .offres3{grid-template-columns:1fr} .circuit{grid-template-columns:1fr} }


/* ═══ Missions 2 et 3 : vues de la classe, dossier facture, stratégie, résultat ═══ */
.sub3{font-family:var(--serif); font-weight:600; font-size:24px; color:#fff; margin:24px 0 12px}
.dos3{padding:18px; border-radius:var(--r-lg); background:rgba(255,255,255,.04); border:2px dashed rgba(251,191,36,.5); position:relative}
.clip{display:inline-block; font-weight:700; color:#1D1F33; background:#FFF3C4; border-radius:10px; padding:6px 14px; margin-bottom:14px; box-shadow:0 6px 16px rgba(0,0,0,.3)}
.docs3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; align-items:start}
.docs3 .paper{padding:16px 16px; font-size:12.5px}
.docs3 .paper .from .co{font-size:15px} .docs3 .paper .from .emb{width:36px; height:36px; font-size:18px}
.docs3 .paper .from p,.docs3 .paper .to{font-size:11px} .docs3 .paper .to{padding:8px 10px}
.docs3 .paper h3.doc{font-size:16px} .docs3 .paper .ref{font-size:10.5px}
.docs3 .paper th,.docs3 .paper td{font-size:11px; padding:5px 6px}
.docs3 .paper .signed{font-size:17px}
.doclab{font-size:13px; font-weight:700; color:var(--yellow); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em}
.paper .dh{flex-wrap:wrap} .paper .from{min-width:0; flex:1 1 200px} .paper .to{min-width:0 !important; flex:0 1 220px; max-width:100%; overflow-wrap:anywhere}
.paper td:nth-last-child(-n+1){white-space:nowrap}
.stamp3{display:inline-block; transform:rotate(-8deg); border:3px solid #2E9E5B; color:#2E9E5B; font-weight:800; letter-spacing:2px; padding:2px 12px; border-radius:8px; font-size:18px}
.match{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.match span{padding:7px 14px; border-radius:999px; background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.45); color:#9ff0c9; font-weight:600; font-size:14px}
.match span:last-child{background:rgba(251,191,36,.14); border-color:rgba(251,191,36,.5); color:#ffd97a}
.why3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.why3 > div{padding:18px 20px; border-radius:var(--r)}
.why3 .wi{font-size:34px} .why3 > div > b{display:block; font-family:var(--serif); font-size:20px; color:#fff; margin:6px 0}
.why3 p{color:var(--soft); font-size:15px}
.tax{padding:20px 22px; border-radius:var(--r); margin-top:16px}
.tax p{color:var(--soft); font-size:16px}
.tax2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px}
.tax2 > div{padding:14px 16px; border-radius:14px; font-family:var(--mono); font-size:14px; display:grid; gap:4px}
.tax2 b{font-family:var(--ui); font-size:16px}
.tax2 .ok{background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.45)}
.tax2 .ko{background:rgba(255,61,139,.1); border:1px solid rgba(255,61,139,.45)}
.tax2 .t{margin-top:4px; padding-top:6px; border-top:1px dashed rgba(255,255,255,.3); font-weight:700; color:#fff}
.mini3{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.mini3 div{padding:10px; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid var(--border-soft)}
.mini3 b{display:block; font-family:var(--mono); font-size:18px; color:#fff}
.mini3 span{font-size:12.5px; color:var(--dim)}
.calc3{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px}
.calc3 label{display:flex; align-items:center; gap:8px; font-weight:600}
.calc3 input{width:110px; background:rgba(10,6,24,.6); color:#fff; border:1px solid var(--border); border-radius:10px; padding:8px 10px; font:700 16px var(--mono)}
.qbar{display:flex; align-items:center; gap:8px; min-width:140px}
.qbar i{display:block; height:12px; border-radius:6px}
.qbar b{font-family:var(--mono); white-space:nowrap}
.vs3{display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:stretch}
.vs3 > div:not(.vsx){padding:14px 16px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid var(--border)}
.vs3 > div > b{display:block; font-family:var(--serif); font-size:22px; color:#fff}
.vs3 small{color:var(--soft)} .vs3 ul{margin:8px 0 0 18px; color:var(--soft); font-size:14.5px}
.vsx{display:grid; place-items:center; font-weight:800; color:var(--yellow); font-size:20px}
.pb,.rt{background:#fff; color:#1D1F33; border-radius:16px; overflow:hidden; box-shadow:0 18px 44px rgba(0,0,0,.45)}
.pb h4,.rt h4{background:linear-gradient(120deg,#8E4EC6,#3E63DD); color:#fff; padding:10px 16px; font-size:16px}
.rt h4{background:linear-gradient(120deg,#E5484D,#E935C5)}
.pb-c,.rt-c{display:grid; grid-template-columns:1fr 1fr}
.pb-c > div,.rt-c > div{padding:12px 14px; display:flex; flex-direction:column}
.pb-c > div + div,.rt-c > div + div{border-left:2px solid #E3E5EF}
.pb h5,.rt h5{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#6B6F88; margin-bottom:4px}
.pb-s{font-size:12px; font-weight:700; color:#8A5BD0; margin:8px 0 2px}
.pb-l{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px dashed #E3E5EF; font-size:14px}
.pb-l small{color:#6B6F88}
.pb-l span:last-child{font-family:var(--mono); font-weight:700; white-space:nowrap}
.pb-l.neg span:last-child{color:#C0392B}
.pb-l.hl{background:#EFFAF3; margin:0 -6px; padding:5px 6px; border-radius:6px}
.pb-t{margin-top:auto; padding-top:8px; display:flex; justify-content:space-between; font-weight:800; border-top:2px solid #1D1F33}
.pb-t span:last-child{font-family:var(--mono)}
.pb-eq{background:#F4F2FB; padding:9px 16px; font-weight:700; font-size:14px}
.flow3{display:grid; gap:8px}
.flow3 > div{display:flex; justify-content:space-between; gap:10px; padding:10px 14px; border-radius:12px; font-size:16px}
.flow3 b{font-family:var(--mono)}
.flow3 .f0,.flow3 .f1{background:rgba(255,255,255,.08); border:1px solid var(--border)}
.flow3 .f1{border-color:rgba(52,211,153,.6)} .flow3 .f1 b{color:#9ff0c9}
.flow3 .fm{background:rgba(255,61,139,.1); color:#ffc4d4} .flow3 .fp{background:rgba(52,211,153,.1); color:#b5f5c8}
.ba3{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:14px; align-items:center; margin-top:18px}
.arr3{font-size:36px; color:var(--yellow)}
.explain3{margin-top:16px; padding:16px 20px; border-radius:var(--r); border:1px solid rgba(52,211,153,.45); background:rgba(52,211,153,.07)}
.explain3 b{color:#9ff0c9} .explain3 p{color:var(--soft); margin-top:6px}
.cellf small{display:block; font-family:var(--mono); color:var(--dim)}
td.mono{font-family:var(--mono); white-space:nowrap}
@media (max-width:1200px){ .docs3,.why3{grid-template-columns:1fr} .ba3{grid-template-columns:1fr} .arr3{transform:rotate(90deg); text-align:center} .tax2{grid-template-columns:1fr} }

/* ═══ Mission 2 v1.1 : le modèle des documents choisi par chaque élève ═══ */
.paper.doc-perso{position:relative; isolation:isolate; overflow:hidden}
.doc-perso .co,.doc-perso h3.doc,.doc-perso .slg{font-family:var(--doc-font); font-weight:var(--doc-weight); font-style:var(--doc-style); letter-spacing:var(--doc-ls)}
.doc-perso .co,.doc-perso h3.doc{color:var(--doc-ink)}
.doc-perso .emb{width:48px; height:48px; border-radius:12px; display:grid; place-items:center; font-size:24px; flex:none}
.doc-perso th{background:color-mix(in srgb,var(--doc) 12%,#fff); border-bottom-color:var(--doc-ink)}
.doc-perso .sig{justify-content:space-between; align-items:center; gap:18px}
.doc-perso .sig > div{margin-left:auto}
.doc-perso .phrase{font-style:italic; color:#3A3E58; max-width:46%; margin:0; font-size:14px}
.doc-perso .foot .slg{display:block; font-size:14px; color:var(--doc-ink); margin-bottom:3px}
.doc-perso .fili{position:absolute; z-index:-1; top:52%; left:56%; transform:translate(-50%,-50%) rotate(-14deg); font-size:260px; line-height:1; opacity:.07; pointer-events:none}
.doc-perso .place2{font-size:14px; margin-bottom:8px}
.doc-perso .tbloc{align-self:flex-end; flex:1 1 220px}
.doc-perso .tbloc .ref{margin-bottom:0}
.tpl-classique .dh{border-bottom:3px solid var(--doc); padding-bottom:12px}
.tpl-bandeau .band{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin:-26px -30px 18px; padding:18px 30px; background:var(--doc); color:var(--on-doc)}
.tpl-bandeau .band .from{flex:0 1 auto}
.tpl-bandeau .band .co{color:var(--on-doc); font-size:23px}
.tpl-bandeau .band .emb{box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.tpl-bandeau .band .bco{display:flex; gap:16px; font-size:12px; line-height:1.4; opacity:.94}
.tpl-bandeau .band .bco p{margin:0}
.tpl-bandeau .band .ids{font-family:var(--mono); font-size:11px; white-space:nowrap}
.tpl-bandeau .dh,.tpl-centre .dh{margin-bottom:6px}
.tpl-colonne{border-left:14px solid var(--doc)}
.tpl-colonne h3.doc{display:inline-block; background:var(--doc); color:var(--on-doc); padding:2px 12px; border-radius:8px}
.tpl-colonne th{background:var(--doc); color:var(--on-doc); border-bottom-color:var(--doc)}
.tpl-centre .ctr{text-align:center; border-bottom:5px double var(--doc); padding-bottom:10px; margin-bottom:14px}
.tpl-centre .ctr-n{display:flex; flex-direction:column; align-items:center; gap:6px}
.tpl-centre .ctr .co{font-size:25px; line-height:1.15}
.tpl-centre .ctr p{font-size:12.5px; color:#4A4E68; margin:3px 0 0}
.tpl-centre .ctr .ids{font-family:var(--mono); font-size:11px}
.tpl-centre h3.doc{letter-spacing:.08em}
.tpl-centre th{background:none; border-bottom:2px solid var(--doc)}
.docs3 .doc-perso .emb{width:36px; height:36px; font-size:18px}
.docs3 .tpl-bandeau .band{margin:-16px -16px 12px; padding:12px 16px}
.docs3 .tpl-bandeau .band .co{font-size:16px}
.docs3 .tpl-bandeau .band .bco{font-size:10px; flex-direction:column; gap:3px}
.docs3 .tpl-bandeau .band .ids{font-size:9.5px}
.docs3 .tpl-centre .ctr .co{font-size:17px}
.docs3 .tpl-centre .ctr p{font-size:10px}
.docs3 .tpl-colonne{border-left-width:8px}
.docs3 .doc-perso .phrase,.docs3 .doc-perso .foot .slg,.docs3 .doc-perso .place2{font-size:11px}
.docs3 .doc-perso .fili{font-size:150px}
.docs3 .doc-perso .sig{flex-direction:column; align-items:stretch; gap:6px}
.docs3 .doc-perso .phrase{max-width:none}
/* Miniatures des modèles (comme dans l'application élève) */

const sb = window.supabase && window.supabase.createClient ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_CLE) : null;
/** Appelle une fonction réservée au professeur. Erreur : e.reserve (compte non autorisé) ou e.session (reconnexion nécessaire). */
async function rpcProf(nom, args){
  if (!sb) throw new Error("La bibliothèque Supabase n'a pas pu se charger (connexion internet ?).");
  const { data, error } = await sb.rpc(nom, args || {});
  if (error){
    const e = new Error(error.message || "Erreur de la base de données");
    e.reserve = /réservé/i.test(error.message || "");
    e.absent = error.code === "PGRST202" || /could not find the function/i.test(error.message || "");
    e.session = /jwt|session|permission denied/i.test(error.message || "") && !e.reserve;
    throw e;
  }
  return data;
}

}

/** État de l'accès des élèves, en clair (pour la barre du haut et le pilotage). */
function etatAcces(){
  const c = APP.config; if (!c) return { ouvert:false, txt:"Accès : inconnu" };
  if (c.acces) return { ouvert:true, txt: c.expiration ? `Accès ouvert jusqu'à ${heure(new Date(c.expiration))}` : "Accès ouvert sans limite" };
  if (c.verrouActif && c.expiration) return { ouvert:false, expire:true, txt:`Accès refermé à ${heure(new Date(c.expiration))}` };
  return { ouvert:false, txt:"Accès fermé" };
}

const eurC = (n) => (Math.round(n * 100) / 100).toLocaleString("fr-BE", {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits:2}) + " €";
const bceDe = (base8) => { const b = String(base8).padStart(8,"0"), n = b + String(97 - (parseInt(b,10) % 97)).padStart(2,"0"); return `${n.slice(0,4)}.${n.slice(4,7)}.${n.slice(7)}`; };

/** Entreprise et achat fictifs, identiques à ce que les élèves ont vécu. */
const E_FICTIF = { prenom:"Alex", nomEleve:"Martin", classe:"3P Vente", typeId:"velos", nom:"Roue Libre", denomination:"Roue Libre", slogan:"La liberté sur deux roues",
  couleur:"#12A594", couleur2:"#FFFFFF", style:"fun", symbole:"🚲", rue:"Rue de la Gare", numero:"18", cp:"7080", commune:"Frameries", direction:"seul", nbAssocies:1,
  bce:bceDe(10234567), iban:"BE71 0631 2345 6769", email2:"contact@rouelibre.be", enBanque:9850, frais:150 };
function achatDepuisCatalogue(bienId, methodeId, choix, raisons, E){
  const b = BIENS.find(x => x.id === bienId);
  const offres = b.fournisseurs.map((f, k) => { const remise = Math.round(f.prix * f.remise) / 100;
    return { numero:`OP-${f.code}-4821`, fNom:f.nom, fForme:f.forme, fAdresse:`${f.rue}, ${f.cp} ${f.ville}`, fRue:f.rue, fVille:`${f.cp} ${f.ville}`, fTva:"BE " + bceDe(40000000 + k * 1234567),
      fTel:f.tel, fWeb:f.web, atout:f.atout, ref:f.ref, article:f.article, detail:f.detail, prix:f.prix, remisePct:f.remise, remise, livraison:f.livraison, total:f.prix - remise + f.livraison,
      delai:f.delai, garantie:f.garantie, paiement:"à la livraison" }; });
  const o = offres[choix];
  return { bien:b, methode:METHODES.find(m => m.id === methodeId), offres, choix, raisons,
    bc:{ numero:"BC-2026-001", date:"5 octobre 2026", signature:`${E.prenom} ${E.nomEleve}` },
    livraisonPrevue:"vendredi 9 octobre", bl:{ numero:`BL-${b.fournisseurs[choix].code}-30418`, date:"9 octobre 2026", signature:`${E.prenom} ${E.nomEleve}`, colis:1 },
    paiement:{ montant:o.total, date:"9 octobre 2026" }, budgetAvant:E.enBanque };
}
/** Un achat réel d'élève (données envoyées par la mission 2) remis dans le même format. */
function achatDepuisEleve(E, k){
  const x = (E.m2.achats || [])[k]; if (!x || !x.offreChoisie) return null;
  const offres = (x.offresRecues || []).map(o => ({ numero:o.numero, fNom:o.fournisseur.nom, fForme:o.fournisseur.forme, fAdresse:o.fournisseur.adresse,
    fRue:(o.fournisseur.adresse || "").split(",")[0], fVille:(o.fournisseur.adresse || "").split(",").slice(1).join(",").trim(), fTva:o.fournisseur.numeroTVA,
    fTel:o.fournisseur.telephone, fWeb:o.fournisseur.site, atout:o.fournisseur.atout, ref:o.reference, article:o.article, detail:o.detail, prix:o.prix,
    remisePct:o.remisePourcent, remise:o.remise, livraison:o.fraisLivraison, total:o.totalAPayer, delai:o.delaiJours, garantie:o.garantieAns, paiement:o.paiement }));
  const choix = Math.max(0, offres.findIndex(o => o.numero === x.offreChoisie.numero));
  const payes = (E.m2.achats || []).slice(0, k).filter(a => a.paiement).reduce((s, a) => s + a.paiement.montant, 0);
  return { bien:BIENS.find(b => b.id === x.bien.id), methode:METHODES.find(m => m.id === (x.methode || {}).id) || METHODES[0], offres, choix, raisons:x.raisonsDuChoix || [],
    bc:{ numero:(x.bonDeCommande || {}).numero || "–", date:(x.bonDeCommande || {}).date || "", signature:(x.bonDeCommande || {}).signature || "" },
    livraisonPrevue:(x.notification || {}).livraisonPrevue || "", bl:{ numero:(x.bonDeLivraison || {}).numero || "–", date:(x.bonDeLivraison || {}).date || "", signature:(x.bonDeLivraison || {}).signature || "", colis:x.bien.id === "mobilier" ? 6 : 1 },
    paiement:{ montant:(x.paiement || {}).montant || offres[choix].total, date:(x.paiement || {}).date || "" }, budgetAvant:(E.enBanque || 0) - payes };
}
const elevesM2 = () => APP.liste.filter(E => E.m2 && (E.m2.achats || []).some(a => a.paiement));
function exemple(){
  if (APP.exemple && APP.exemple !== "fictif"){
    const E = APP.liste.find(x => x.email === APP.exemple);
    if (E && E.m2){ const A = achatDepuisEleve(E, APP.exAchat || 0); if (A) return { E, A, fictif:false }; }
  }
  return { E:E_FICTIF, A:achatDepuisCatalogue("ordinateur", "email", 1, ["La garantie la plus longue", "La livraison gratuite"], E_FICTIF), fictif:true };
}

const CLE_CACHE = "mini-entreprise-3p-prof-cache";
const attendre = (ms) => new Promise(r => setTimeout(r, ms));
function appliquerDonnees(r, maj){

/** Connexion avec le compte professeur (Supabase Auth, le même que pour la JPO). */
async function connecter(){
  const email = (($("#pmail") || {}).value || "").trim().toLowerCase(), code = ($("#pcode") || {}).value || "";
  if (!email || !code){ APP.err = "Écris l'adresse e-mail et le code du compte professeur."; render(); return; }
  if (!sb){ APP.err = "La bibliothèque Supabase n'a pas pu se charger : vérifie la connexion internet, puis recharge la page."; render(); return; }
  APP.busy = true; APP.err = ""; APP.email = email; render();
  const { error } = await sb.auth.signInWithPassword({ email, password:code });
  APP.busy = false;
  if (error){ APP.err = /invalid/i.test(error.message || "") ? "Adresse ou code incorrect." : "Connexion impossible : " + error.message; render(); return; }
  try { localStorage.setItem(CONFIG.EMAIL_STOCKAGE, email); } catch(e) {}
  APP.source = "chargement"; render();
  await charger(); planifier();
}
/** Chargement : les dernières données restent affichées si la base ne répond pas. */
async function charger(silencieux){
  if (!sb){ APP.err = "La bibliothèque Supabase n'a pas pu se charger : vérifie la connexion internet, puis recharge la page."; APP.source = null; render(); return; }
  if (APP.busy) return;
  APP.busy = true; if (!silencieux) render();
  try {
    const r = await rpcProf("me_prof_tableau");
    APP.busy = false; APP.err = "";
    try { localStorage.setItem(CLE_CACHE, JSON.stringify({ maj:Date.now(), dossiers:r.dossiers, config:r.config, inscrits:r.inscrits })); } catch(e) {}
    appliquerDonnees(r, new Date()); render();
  } catch(e) {
    APP.busy = false;
    if (e.absent){
      APP.err = "La base de la mini-entreprise n'est pas encore installée : colle d'abord les fichiers SQL 1 puis 2 dans Supabase (SQL Editor), comme expliqué dans le guide.";
      APP.source = null; APP.liste = []; APP.brut = null; clearInterval(minuterie); render(); return;
    }
    if (e.reserve || e.session){
      APP.err = e.reserve ? "Ce compte n'est pas autorisé : il doit être dans la liste des professeurs (table « profs » de Supabase)." : "Ta connexion a expiré : reconnecte-toi.";
      try { await sb.auth.signOut(); localStorage.removeItem(CLE_CACHE); } catch(x) {}
      APP.source = null; APP.liste = []; APP.brut = null; clearInterval(minuterie); render(); return;
    }
    if (APP.liste.length && APP.source === "live") APP.err = "La base ne répond pas : affichage des dernières données reçues. Nouvel essai automatique.";
    else { APP.err = "Impossible de joindre la base de données pour l'instant. Vérifie la connexion internet, puis réessaie."; APP.source = null; }
    render();
  }
}

/** Action du professeur : appel à la base, message, puis rechargement des données. */
async function actionProf(fn, message){
  if (APP.source !== "live"){ noter("Connecte-toi pour piloter ta classe (ici : données de démonstration).", "ko"); return null; }
  if (APP.action) return null;
  APP.action = true; render();
  try {
    const r = await fn(); APP.action = false;
    if (r && r.config) APP.config = r.config;
    if (message) noter(typeof message === "function" ? message(r) : message);
    render(); await charger(true); return r;
  } catch(e) {
    APP.action = false; noter("⚠️ " + esc(e.message || "Erreur"), "ko");
    if (e.reserve || e.session) charger(true); else render(); return null;
  }
}

function lireListeCollee(txt){

    const c = l.split(/\t|;|,/).map(x => x.trim()).filter(Boolean), email = (c.find(x => x.includes("@")) || "").toLowerCase(), reste = c.filter(x => !x.includes("@"));
    const p = email.split("@")[0].split(".");
    return { email, prenom:reste[0] || capitaliser(p[0] || ""), nom:reste[1] || p.slice(1).map(capitaliser).join(" "), classe:reste[2] || "" };
  }).filter(x => x.email);
}
function exporterCSV(){

    const xp = l.dossier ? Object.values(l.dossier.missions || {}).reduce((n, m) => n + (+m.xp || 0), 0) : "";
    const bq = e.patrimoine && e.patrimoine.argentEnBanque != null ? e.patrimoine.argentEnBanque : (e.argent && e.argent.argentEnBanque != null ? e.argent.argentEnBanque : "");
    return [l.email, l.prenom, l.nom, l.classe, l.inscrit ? "oui" : "non", e.denomination || e.nom || "", t ? t.nom : "", s ? s.nom : "", e.forme || "", (e.adresse || {}).commune || "",

  if (b.dataset.reinit){
    const email = b.dataset.reinit, m = b.dataset.m, x = missionDe(lignesPilotage().find(l => l.email === email) || {}, m) || {};
    if (!confirm(`Rouvrir la mission ${m} de ${nomDe(email)} ?\n\nÉtat actuel : ${(LIB_STATUT[x.statut] || ["", x.statut || "?"])[1]}.\nSon travail est archivé (rien n'est perdu) et ses choix seront préremplis : il ou elle pourra les modifier.`)) return;
    await actionProf(() => rpcProf("me_prof_reinitialiser", { p_email:email, p_mission:m }), `🔄 Mission ${m} rouverte pour ${esc(nomDe(email))}.`); return;
  }
  if (b.dataset.suppr){
    const email = b.dataset.suppr, rep = prompt(`Supprimer le dossier de ${nomDe(email)} (${email}) ?\nÀ utiliser pour les comptes de test. Une copie complète reste dans le journal de la base.\n\nÉcris SUPPRIMER pour confirmer :`);
    if ((rep || "").trim().toUpperCase() !== "SUPPRIMER") return;
    await actionProf(() => rpcProf("me_prof_supprimer_dossier", { p_email:email }), `🗑️ Dossier de ${esc(nomDe(email))} supprimé.`); return;
  }
  if (b.dataset.desinscrire){
    const email = b.dataset.desinscrire;
    if (!confirm(`Retirer ${nomDe(email)} (${email}) de la liste de la classe ?\nSon dossier, lui, est gardé.`)) return;
    await actionProf(() => rpcProf("me_prof_inscrit_retirer", { p_email:email }), `${esc(email)} retiré de la liste.`); return;
  }
  switch (b.dataset.pilot){
    case "ouvrir": await actionProf(() => rpcProf("me_prof_ouvrir", { p_duree:APP.duree || (APP.config && APP.config.duree) || "2h" }),
      r => `🟢 Accès ouvert ${r && r.config && r.config.expiration ? "jusqu'à " + heure(new Date(r.config.expiration)) : "sans limite de temps (pense à le fermer)"}.`); break;
    case "fermer": await actionProf(() => rpcProf("me_prof_fermer"), "🔴 Accès fermé : les élèves ne peuvent plus rien modifier."); break;
    case "max": {
      const v = Number(($("#pmax") || {}).value);
      if (!Number.isInteger(v) || v < 0 || v > 99){ noter("Écris un nombre entier entre 0 et 99.", "ko"); return; }
      await actionProf(() => rpcProf("me_prof_reglages", { p_reglages:{ max:v } }), v ? `Maximum : ${v} élèves par activité.` : "Plus de limite par activité."); break;
    }
    case "inscrits": {
      const nv = !(APP.config && APP.config.inscritsObligatoire);
      if (nv && !(APP.inscrits || []).length && !confirm("La liste de la classe est vide : plus aucun élève ne pourra travailler. Continuer ?")) return;
      await actionProf(() => rpcProf("me_prof_reglages", { p_reglages:{ inscritsObligatoire:nv } }), nv ? "Seuls les élèves de la liste peuvent travailler." : "Toute adresse @istlm.org peut travailler."); break;
    }
    case "ajouter": {
      const liste = lireListeCollee(($("#pinscrits") || {}).value);
      if (!liste.length){ noter("Colle au moins une adresse e-mail (une ligne par élève).", "ko"); return; }
      await actionProf(() => rpcProf("me_prof_inscrits_ajouter", { p_liste:liste }),
        r => `${r.ajoutes} élève${r.ajoutes > 1 ? "s" : ""} ajouté${r.ajoutes > 1 ? "s" : ""}, ${r.misAJour} mis à jour${r.refuses && r.refuses.length ? ` · refusé (adresse non valide) : ${esc(r.refuses.join(", "))}` : ""}.`); break;
    }
    case "export": {
      if (APP.source !== "live"){ noter("Connecte-toi pour télécharger la sauvegarde.", "ko"); return; }
      try { const r = await rpcProf("me_prof_export"); telecharger(JSON.stringify(r, null, 2), `sauvegarde-mini-entreprise-${dateFichier()}.json`, "application/json"); noter("💾 Sauvegarde téléchargée."); }
      catch(err) { noter("⚠️ " + esc(err.message), "ko"); }
      break;
    }
    case "csv": exporterCSV(); noter("📊 Tableau des élèves téléchargé (s'ouvre avec Excel)."); break;
  }
});

/** Démarrage : si le professeur est déjà connecté sur cet ordinateur, on affiche tout de suite ses données. */
async function demarrer(){
  if (!sb){ APP.err = "La bibliothèque Supabase n'a pas pu se charger : vérifie la connexion internet, puis recharge la page."; render(); return; }
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch(e) {}
  if (!session){ render(); return; }
  try { const c = JSON.parse(localStorage.getItem(CLE_CACHE) || "null"); if (c && c.dossiers) appliquerDonnees(c, new Date(c.maj)); } catch(e) {}
  if (APP.source !== "live") APP.source = "chargement";
  render(); await charger(true); planifier();
}
demarrer();
</script>
